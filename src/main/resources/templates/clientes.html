<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head}"></head>
<body>
<nav th:replace="~{fragments :: nav}"></nav>
<main class="container py-4">
  <h3 th:text="${cliente.id == null} ? 'Novo cliente' : 'Editar cliente #' + ${cliente.id}">Cliente</h3>
  <form th:action="@{/clientes}" th:object="${cliente}" method="post" class="row g-2 mb-4">
    <input type="hidden" th:field="*{id}"/>
    <div class="col-md-4"><input th:field="*{nome}" class="form-control" placeholder="Nome"/>
      <small class="text-danger" th:errors="*{nome}"></small></div>
    <div class="col-md-4"><input th:field="*{email}" class="form-control" placeholder="E-mail"/>
      <small class="text-danger" th:errors="*{email}"></small></div>
    <div class="col-md-4"><button class="btn btn-warning">Salvar</button>
      <a class="btn btn-link" th:href="@{/clientes}">Limpar</a></div>
  </form>
  <table class="table table-striped">
    <thead><tr><th>Id</th><th>Nome</th><th>E-mail</th><th></th></tr></thead>
    <tbody>
      <tr th:each="c : ${clientes}">
        <td th:text="${c.id}"></td><td th:text="${c.nome}"></td><td th:text="${c.email}"></td>
        <td class="d-flex gap-2">
          <a class="btn btn-sm btn-outline-primary" th:href="@{/clientes/{id}/editar(id=${c.id})}">Editar</a>
          <form th:action="@{/clientes/{id}/excluir(id=${c.id})}" method="post">
            <button class="btn btn-sm btn-outline-danger">Excluir</button></form>
        </td>
      </tr>
    </tbody>
  </table>
</main>
</body>
</html>
