<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head}"></head>
<body>
<nav th:replace="~{fragments :: nav}"></nav>
<main class="container py-4">
  <h3 th:text="${conta.id == null} ? 'Nova conta' : 'Editar conta #' + ${conta.id}">Conta</h3>
  <form th:action="@{/contas}" th:object="${conta}" method="post" class="row g-2 mb-4">
    <input type="hidden" th:field="*{id}"/>
    <div class="col-md-3"><input th:field="*{numero}" class="form-control" placeholder="Número"/>
      <small class="text-danger" th:errors="*{numero}"></small></div>
    <div class="col-md-3"><input th:field="*{saldo}" type="number" step="0.01" class="form-control" placeholder="Saldo"/>
      <small class="text-danger" th:errors="*{saldo}"></small></div>
    <div class="col-md-3">
      <select th:field="*{cliente.id}" class="form-select">
        <option th:each="c : ${clientes}" th:value="${c.id}" th:text="${c.nome}"></option>
      </select>
      <small class="text-danger" th:errors="*{cliente.id}"></small></div>
    <div class="col-md-3"><button class="btn btn-warning">Salvar</button>
      <a class="btn btn-link" th:href="@{/contas}">Limpar</a></div>
  </form>
  <table class="table table-striped">
    <thead><tr><th>Id</th><th>Número</th><th>Saldo</th><th>Cliente</th><th></th></tr></thead>
    <tbody>
      <tr th:each="c : ${contas}">
        <td th:text="${c.id}"></td><td th:text="${c.numero}"></td>
        <td th:text="${#numbers.formatDecimal(c.saldo,1,'POINT',2,'COMMA')}"></td>
        <td th:text="${c.cliente.nome}"></td>
        <td class="d-flex gap-2">
          <a class="btn btn-sm btn-outline-primary" th:href="@{/contas/{id}/editar(id=${c.id})}">Editar</a>
          <form th:action="@{/contas/{id}/excluir(id=${c.id})}" method="post">
            <button class="btn btn-sm btn-outline-danger">Excluir</button></form>
        </td>
      </tr>
    </tbody>
  </table>
</main>
</body>
</html>
